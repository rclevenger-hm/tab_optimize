name: Test extension

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate extension package
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build installable archive
        run: |
          mkdir -p dist
          zip -r dist/tab-optimize.zip \
            manifest.json background popup options shared icons \
            -x '*.DS_Store'

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: tab-optimize-extension
          path: dist/tab-optimize.zip
          if-no-files-found: error
